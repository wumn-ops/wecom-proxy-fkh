# Nginx 片段 — wecom-proxy-fkh（API Webhook 模式，前缀 /fkh-api，反代 8002）
# 与 wecom-proxy（8000）、wecom-socket-proxy-fkh（8001，/fkh）共用域名 wecom.vazyme.com:8021
#
# ⚠️ 注意：
# 1. location 修饰符后必须有空格：location = /path（不能写 location =/path）
# 2. fkh-api 规则必须放在 /wecom/aibot/callback 之前（或路径更长），否则会被 8000 抢走
# 3. register 用前缀匹配，才能覆盖 /register/upload/fkh-api/api/* 子路径

        location /wecom/aibot/callback/fkh-api {
            proxy_pass http://192.168.140.92:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/fkh-api {
            proxy_pass http://192.168.140.92:8002;
        }

        location /crm/bind/fkh-api {
            proxy_pass http://192.168.140.92:8002;
            proxy_set_header Host $host;
        }

        location /register/upload/fkh-api {
            proxy_pass http://192.168.140.92:8002;
            client_max_body_size 10m;
        }
